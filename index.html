<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="2호차 셔틀">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#1d4ed8">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>2호차 셔틀 시간표</title>
<style>
:root{--brand:#1d4ed8;--brand2:#0b3bb0;--ink:#0f172a;--ink2:#54627a;--line:#dbe3ef;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:#eef1f6;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Helvetica Neue",AppleGothic,sans-serif;
  -webkit-text-size-adjust:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100%;padding:calc(28px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 80% at 50% -10%,#e8eeff 0%,#eef1f6 46%,#e9edf4 100%);
}
.lock{width:100%;max-width:380px}
.card{
  background:#fff;border:1px solid var(--line);border-radius:22px;
  padding:26px 22px 22px;text-align:center;
  box-shadow:0 18px 44px rgba(15,23,42,.10),0 2px 6px rgba(15,23,42,.05);
}
.bus{
  width:74px;height:74px;margin:0 auto 14px;border-radius:22px;
  background:linear-gradient(160deg,#2f6bff 0%,var(--brand) 52%,var(--brand2) 100%);
  display:flex;align-items:center;justify-content:center;font-size:38px;line-height:1;
  box-shadow:0 10px 22px rgba(29,78,216,.32);
}
h1{margin:0;font-size:21px;font-weight:900;letter-spacing:-.045em}
.sub{margin:6px 0 0;font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:-.02em}
form{margin:22px 0 0}
.lbl{display:block;font-size:12px;font-weight:900;color:var(--ink2);letter-spacing:-.01em;margin-bottom:8px}
.pin{
  width:100%;height:62px;border:1.5px solid var(--line);border-radius:15px;background:#f7f9fc;
  font-size:30px;font-weight:900;letter-spacing:16px;text-indent:16px;text-align:center;
  padding-left:16px;color:var(--ink);font-family:inherit;
  -webkit-appearance:none;appearance:none;caret-color:var(--brand);
}
.pin::placeholder{letter-spacing:10px;text-indent:10px;color:#b6c1d1;font-size:22px}
.pin:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3.5px #e8efff}
.pin.bad{border-color:#dc2626;background:#fef2f2;animation:shake .34s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.rem{display:flex;align-items:center;justify-content:center;gap:7px;margin:14px 0 0;font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:-.01em;cursor:pointer;user-select:none}
.rem input{
  -webkit-appearance:none;appearance:none;width:19px;height:19px;margin:0;border:1.5px solid #c3cdda;border-radius:6px;background:#fff;position:relative;flex:0 0 auto;
}
.rem input:checked{background:var(--brand);border-color:var(--brand)}
.rem input:checked::after{
  content:"";position:absolute;left:6px;top:2.5px;width:5px;height:10px;
  border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(42deg);
}
.go{
  width:100%;height:52px;margin:18px 0 0;border:0;border-radius:14px;color:#fff;
  font-size:16px;font-weight:900;letter-spacing:-.02em;font-family:inherit;
  background:linear-gradient(180deg,#2f6bff,var(--brand) 60%,#1a45bd);
  box-shadow:0 8px 18px rgba(29,78,216,.28);
}
.go:active{transform:scale(.985);filter:brightness(.96)}
.go[disabled]{opacity:.62;box-shadow:none}
.msg{min-height:18px;margin:11px 0 0;font-size:12px;font-weight:800;letter-spacing:-.01em;color:#dc2626;line-height:1.4}
.msg.info{color:#64748b}
.foot{margin:18px 0 0;text-align:center;font-size:11px;line-height:1.65;font-weight:700;color:#9aa6b6;letter-spacing:-.01em}
.hint{display:none;margin:0 0 14px;font-size:11.5px;color:#8a97a8;font-weight:700}
@media (prefers-color-scheme:dark){:root{color-scheme:light}}
</style>
</head>
<body>
<main class="lock">
  <div class="card" id="card">
    <div class="bus" aria-hidden="true">🚐</div>
    <h1>2호차 셔틀 시간표</h1>
    <p class="sub">2호차 셔틀 · 비밀번호 잠금</p>
    <p class="hint" id="hint">이 기기에서 여는 중…</p>
    <form id="f" autocomplete="off" novalidate>
      <label class="lbl" for="pw">비밀번호 입력</label>
      <input class="pin" id="pw" type="password" inputmode="numeric" autocomplete="new-password"
             autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"
             maxlength="4" pattern="[0-9]*" aria-label="4자리 숫자 비밀번호">
      <label class="rem"><input type="checkbox" id="rem"><span>이 기기에서 기억하기</span></label>
      <button class="go" id="go" type="submit">열기</button>
      <p class="msg" id="msg" role="alert" aria-live="polite"></p>
    </form>
  </div>
  <p class="foot">비밀번호로 보호된 시간표입니다<br>2026-11-19 최종본 · 2호차</p>
</main>

<script>
(function(){
"use strict";
var P = JSON.parse(document.getElementById("payload").textContent);
var STORE_KEY = "shuttle2.unlock.v1";
var pwEl = document.getElementById("pw"), remEl = document.getElementById("rem"),
    goEl = document.getElementById("go"), msgEl = document.getElementById("msg"),
    hintEl = document.getElementById("hint"), formEl = document.getElementById("f");
var enc = new TextEncoder(), dec = new TextDecoder("utf-8");
var busy = false, fails = 0, cooldownUntil = 0;

function b64ToBuf(b64){
  var bin = atob(b64), n = bin.length, arr = new Uint8Array(n);
  for (var i = 0; i < n; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
function bufToB64(buf){
  var b = new Uint8Array(buf), s = "", CH = 0x8000;
  for (var i = 0; i < b.length; i += CH) s += String.fromCharCode.apply(null, b.subarray(i, i + CH));
  return btoa(s);
}
function readStore(){
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    var o = JSON.parse(raw);
    if (!o || o.v !== 1 || o.salt !== P.salt || o.iter !== P.iter || !o.key) return null;
    return o;
  } catch (e) { return null; }
}
function writeStore(b64Key){
  try { localStorage.setItem(STORE_KEY, JSON.stringify({v:1, salt:P.salt, iter:P.iter, key:b64Key})); } catch (e) {}
}
function dropStore(){ try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

function deriveKey(pw){
  var base = crypto.subtle.importKey("raw", enc.encode(pw), {name:"PBKDF2"}, false, ["deriveKey"]);
  return base.then(function(k){
    return crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64ToBuf(P.salt), iterations:P.iter, hash:"SHA-256"},
      k, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  });
}
function decryptWith(key){
  var ct = b64ToBuf(P.ct), iv = b64ToBuf(P.iv);
  var extra = P.aad ? b64ToBuf(P.aad) : undefined;
  return crypto.subtle.decrypt({name:"AES-GCM", iv:iv, additionalData:extra, tagLength:128}, key, ct)
    .then(function(buf){ return dec.decode(buf); });
}
function show(html){
  /* 1) head/body 교체 + 스크립트 재실행 (document.open 없이 확실하게) */
  try {
    if (mount(html)) return true;
  } catch (e) {}
  /* 2) 마지막 수단: iframe */
  try {
    var f = document.createElement("iframe");
    f.setAttribute("style","position:fixed;top:env(safe-area-inset-top);left:0;width:100%;height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));border:0;background:#eef1f6;z-index:99");
    f.title = "2호차 셔틀 시간표";
    document.documentElement.style.background = "#eef1f6";
    document.body.innerHTML = "";
    document.body.style.cssText = "margin:0;padding:0;display:block;background:#eef1f6";
    document.body.appendChild(f);
    f.srcdoc = html;
    return true;
  } catch (e) { return false; }
}
function mount(html){
  var doc = new DOMParser().parseFromString(html, "text/html");
  if (!doc || !doc.head || !doc.body) return false;
  if (!doc.body.childElementCount && !doc.body.textContent.trim()) return false;
  var i, n, el;
  document.head.innerHTML = "";
  for (i = 0; i < doc.head.childNodes.length; i++) {
    n = doc.head.childNodes[i];
    if (n.nodeName === "SCRIPT") continue;
    document.head.appendChild(document.importNode(n, true));
  }
  document.body.innerHTML = "";
  document.body.removeAttribute("style");
  document.documentElement.style.background = "";
  var nodes = doc.body.childNodes, buf = [];
  for (i = 0; i < nodes.length; i++) {
    n = nodes[i];
    if (n.nodeName === "SCRIPT") {
      el = document.createElement("script");
      for (var a = 0; a < n.attributes.length; a++) {
        el.setAttribute(n.attributes[a].name, n.attributes[a].value);
      }
      el.textContent = n.textContent;
      buf.push(el);
    } else {
      buf.push(document.importNode(n, true));
    }
  }
  for (i = 0; i < buf.length; i++) document.body.appendChild(buf[i]);
  document.documentElement.removeAttribute("style");
  if (typeof window.scrollTo === "function") window.scrollTo(0, 0);
  var seen = document.querySelectorAll("#list .card, #list .row-empty, #others .card").length;
  return !!document.querySelector("header") && seen > 0;
}
function setBusy(on, label){
  busy = on;
  goEl.disabled = on;
  goEl.textContent = on ? (label || "확인 중…") : "열기";
  pwEl.disabled = on;
}
function bad(text){
  msgEl.className = "msg";
  msgEl.textContent = text || "비밀번호가 맞지 않습니다";
  pwEl.classList.remove("bad");
  void pwEl.offsetWidth;
  pwEl.classList.add("bad");
  pwEl.value = "";
  setTimeout(function(){ try { pwEl.focus(); } catch (e) {} }, 60);
}
function good(){ msgEl.textContent = ""; msgEl.className = "msg"; }
function showForm(){
  hintEl.style.display = "none";
  pwEl.style.display = "";
  var lb = document.querySelector(".lbl"), rm = document.querySelector(".rem");
  if (lb) lb.style.display = "";
  if (rm) rm.style.display = "";
  goEl.style.display = "";
}

function unlock(pw, fromStore){
  if (busy) return;
  hintEl.style.display = "none";
  setBusy(true, fromStore ? "여는 중…" : "확인 중…");
  good();
  var p;
  if (fromStore) {
    var st = readStore();
    if (!st) { setBusy(false); return; }
    p = crypto.subtle.importKey("raw", b64ToBuf(st.key), {name:"AES-GCM"}, false, ["decrypt"])
      .then(function(k){ return decryptWith(k); });
  } else {
    p = deriveKey(pw).then(function(k){
      return decryptWith(k).then(function(html){
        if (remEl.checked) {
          return crypto.subtle.exportKey("raw", k).then(function(raw){
            writeStore(bufToB64(raw));
            return html;
          });
        }
        dropStore();
        return html;
      });
    });
  }
  p.then(function(html){
    if (!html || html.indexOf("<html") < 0) throw new Error("empty");
    if (show(html)) return;
    throw new Error("render");
  }).catch(function(){
    if (fromStore) {
      dropStore();
      setBusy(false);
      showForm();
      setTimeout(function(){ try { pwEl.focus(); } catch (e) {} }, 80);
      return;
    }
    setBusy(false);
    fails++;
    var now = Date.now();
    if (fails >= 3) { cooldownUntil = now + 3000; }
    bad(fails >= 3 ? "잠시 후 다시 시도해 주세요" : "비밀번호가 맞지 않습니다");
  });
}

formEl.addEventListener("submit", function(e){
  e.preventDefault();
  if (busy) return;
  if (Date.now() < cooldownUntil) { bad("잠시 후 다시 시도해 주세요"); return; }
  var v = (pwEl.value || "").replace(/[^0-9]/g, "");
  if (v.length !== 4) { bad("숫자 4자리를 입력해 주세요"); return; }
  unlock(v, false);
});
pwEl.addEventListener("input", function(){
  pwEl.classList.remove("bad");
  if (msgEl.className.indexOf("info") < 0 && msgEl.textContent) good();
  var v = (pwEl.value || "").replace(/[^0-9]/g, "").slice(0, 4);
  if (v !== pwEl.value) pwEl.value = v;
  if (v.length === 4 && !busy && Date.now() >= cooldownUntil) unlock(v, false);
});

/* 자동 실행 */
if (!(window.crypto && crypto.subtle)) {
  hintEl.style.display = "none";
  msgEl.className = "msg";
  msgEl.textContent = "이 브라우저에서는 보안 연결(https)에서만 열 수 있습니다";
} else if (readStore()) {
  hintEl.style.display = "block";
  pwEl.style.display = "none";
  var lb0 = document.querySelector(".lbl"), rm0 = document.querySelector(".rem");
  if (lb0) lb0.style.display = "none";
  if (rm0) rm0.style.display = "none";
  goEl.style.display = "none";
  unlock(null, true);
} else {
  /* 예전 버전이 남긴 해제 정보가 있으면 조용히 지운다 (오류 표시 없이 잠금 화면) */
  try { if (localStorage.getItem(STORE_KEY)) dropStore(); } catch (e) {}
  setTimeout(function(){ try { pwEl.focus(); } catch (e) {} }, 220);
}
})();
</script>
</body>
</html>
